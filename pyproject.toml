[project]
name = "hierarchical-scaffold-bpe"
version = "0.1.0"
description = "Reproducible BPE, Scaffold-BPE, and Hierarchical Scaffold-BPE experiments"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.10,<2",
  "datasets>=4.1,<5",
  "huggingface-hub>=0.35,<1",
  "numpy>=2.0,<3",
  "regex>=2025.7.34",
  "safetensors>=0.6,<1",
  "tiktoken>=0.11,<1",
  "tqdm>=4.67,<5",
  "transformers>=4.56,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.13,<1"]

[project.scripts]
hscaffold = "hscaffold_bpe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hscaffold_bpe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
